# 6. РАЗМЕР СУНДУКА
chest:
  size: 54                 # Размер инвентаря сундука (кратно 9)
  max_slots: 35            # Максимум слотов, которые будут заполнены
  min_empty_slots: 10      # Минимум пустых слотов оставить
  guaranteed_min: 1        # Минимум гарантированных (100%) предметов
  guaranteed_max: 0        # Максимум (0 = все гарантированные)

# 7. БОССЫ
bosses:
  zombie_boss:                               # ID босса
    enabled: true                            # Включен ли босс
    respawn_delay: 30                        # Задержка респавна (сек)
    required_environment: "NORMAL"           # Мир (NORMAL / NETHER / THE_END)
    arena:
      enabled: true                          # Привязывать к арене
    spawn:                                   # Точка спавна
      world: "world"                         # Название мира
      x: 0.0                                 # Координата X
      y: 0.0                                 # Координата Y
      z: 0.0                                 # Координата Z
      radius: 10                             # Радиус спавна
    boss:                                    # Параметры босса
      type: "ZOMBIE"                         # Тип сущности
      health: 200.0                          # Максимальное здоровье
      name: "&c&lГлавный Зомби"              # Отображаемое имя
      damage: 5.0                            # Урон босса
    helpers:                                 # Помощники
      enabled: true                          # Включены ли
      spawn_mode: "ON_HEALTH_PERCENT"        # Режим (ON_SPAWN / ON_HEALTH_PERCENT)
      health_thresholds: [75, 50, 25]        # Пороги здоровья для спавна
      count: 3                               # Количество помощников
      health: 40.0                           # Здоровье помощника
      type: "ZOMBIE"                         # Тип помощника
      boss_invulnerable: true                # Босс неуязвим, пока живы помощники
      damage: 3.0                            # Урон помощника
      spawn_message: "&6&l⚔️ &fПомощники появились!"  # Сообщение

  skeleton_boss:                             # Скелет-Воин
    enabled: true
    respawn_delay: 30
    required_environment: "NORMAL"
    arena:
      enabled: true
    spawn:
      world: "world"
      x: 0.0
      y: 0.0
      z: 0.0
