# ---------------------------------------------------------------------------
# 1. АВТОМАТИЧЕСКИЙ СПАВН БОССОВ
# ---------------------------------------------------------------------------
auto_spawn:
  enabled: true                # Включить автоспавн боссов по календарю
  spawn_radius: 10             # Радиус спавна вокруг точки (в блоках)
  announce_before_spawn: true  # Оповещать игроков заранее (Title + чат)
  announce_time: 30            # За сколько секунд до спавна оповещать

# ---------------------------------------------------------------------------
# 2. КАЛЕНДАРЬ СОБЫТИЙ
# ---------------------------------------------------------------------------
calendar:
  enabled: true                              # Включить календарь и автоспавн
  command: "/calendar"                       # Команда для открытия календаря
  title: "&6&l📅 Календарь событий"          # Заголовок GUI календаря
  size: 54                                   # Размер инвентаря (кратно 9)
  timezone: "Europe/Moscow"                  # Часовой пояс для расписания
  block_buy_before_minutes: 60               # За сколько минут до календарного босса запрещать покупку
  schedule:                                  # Расписание боссов по дням недели
    monday:                                  # Понедельник
      - time: "12:00"                        # Время события (ЧЧ:ММ)
        boss: "zombie_boss"                  # ID босса (из раздела bosses)
        message: "&a&lСегодня в 12:00 появится Главный Зомби!"  # Сообщение в чат
      - time: "18:00"                        # Второе событие в понедельник
        boss: "skeleton_boss"                # ID босса
        message: "&a&lСегодня в 18:00 появится Скелет-Воин!"  # Сообщение
    tuesday:                                 # Вторник
      - time: "15:00"                        # Время
        boss: "spider_boss"                  # ID босса
        message: "&a&lСегодня в 15:00 появится Паук-Король!"  # Сообщение
    wednesday:                               # Среда
      - time: "14:00"                        # Время
        boss: "zombie_boss"                  # ID босса
        message: "&a&lСегодня в 14:00 появится Главный Зомби!"  # Сообщение
      - time: "19:00"                        # Второе событие
        boss: "dragon_boss"                  # ID босса
        message: "&a&lСегодня в 19:00 появится ★ Дракон Края ★!"  # Сообщение
    thursday:                                # Четверг
      - time: "16:00"                        # Время
        boss: "skeleton_boss"                # ID босса
        message: "&a&lСегодня в 16:00 появится Скелет-Воин!"  # Сообщение
    friday:                                  # Пятница
      - time: "17:00"                        # Время
        boss: "piglin_boss"                  # ID босса
        message: "&a&lСегодня в 17:00 появится Повелитель Незера!"  # Сообщение
      - time: "22:00"                        # Второе событие
        boss: "dragon_boss"                  # ID босса
        message: "&a&lСегодня в 22:00 появится ★ Дракон Края ★!"  # Сообщение
    saturday:                                # Суббота
      - time: "10:00"                        # Время
        boss: "zombie_boss"                  # ID босса
        message: "&a&lСегодня в 10:00 появится Главный Зомби!"  # Сообщение
      - time: "22:00"                        # Второе событие
        boss: "dragon_boss"                  # ID босса
        message: "&a&lСегодня в 22:00 появится ★ Дракон Края ★!"  # Сообщение
    sunday: []                               # Воскресенье — пустое расписание

