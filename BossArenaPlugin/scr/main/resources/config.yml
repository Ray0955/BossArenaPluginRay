# 1. АВТОМАТИЧЕСКИЙ СПАВН БОССОВ
auto_spawn:
  enabled: true                # Включить автоспавн по календарю
  spawn_radius: 10             # Радиус спавна босса вокруг точки (в блоках)
  announce_before_spawn: true  # Оповещать игроков заранее
  announce_time: 30            # За сколько секунд до спавна оповещать

# 2. КАЛЕНДАРЬ СОБЫТИЙ
calendar:
  enabled: true                              # Включить календарь и автоспавн
  command: "/calendar"                       # Команда для открытия календаря
  title: "&6&l📅 Календарь событий"          # Заголовок GUI календаря
  size: 54                                   # Размер инвентаря (кратно 9)
  timezone: "Europe/Moscow"                  # Часовой пояс для расписания
  schedule:                                  # Расписание по дням недели
    monday:                                  # Понедельник
      - time: "12:00"                        # Время события (ЧЧ:ММ)
        boss: "zombie_boss"                  # ID босса из раздела bosses
        message: "&a&lСегодня в 12:00 появится Главный Зомби!"  # Сообщение
      - time: "18:00"                        # Второе событие в понедельник
        boss: "skeleton_boss"
        message: "&a&lСегодня в 18:00 появится Скелет-Воин!"
    tuesday:                                 # Вторник
      - time: "15:00"
        boss: "spider_boss"
        message: "&a&lСегодня в 15:00 появится Паук-Король!"
    wednesday:                               # Среда
      - time: "14:00"
        boss: "zombie_boss"
        message: "&a&lСегодня в 14:00 появится Главный Зомби!"
      - time: "19:00"
        boss: "dragon_boss"
        message: "&a&lСегодня в 19:00 появится ★ Дракон Края ★!"
    thursday:                                # Четверг
      - time: "16:00"
        boss: "skeleton_boss"
        message: "&a&lСегодня в 16:00 появится Скелет-Воин!"
    friday:                                  # Пятница
      - time: "17:00"
        boss: "piglin_boss"
        message: "&a&lСегодня в 17:00 появится Повелитель Незера!"
      - time: "22:00"
        boss: "dragon_boss"
        message: "&a&lСегодня в 22:00 появится ★ Дракон Края ★!"
    saturday:                                # Суббота
      - time: "10:00"
        boss: "zombie_boss"
        message: "&a&lСегодня в 10:00 появится Главный Зомби!"
      - time: "22:00"
        boss: "dragon_boss"
        message: "&a&lСегодня в 22:00 появится ★ Дракон Края ★!"
    sunday: []                               # Воскресенье — пустое расписание

# 3. НАСТРОЙКИ СУНДУКА
chest_settings:
  open_time: 10           # Секунд до открытия сундука
  despawn_time: 30        # Секунд до исчезновения после открытия
  despawn_effects: true   # Показывать частицы при исчезновении

