# 1. АВТОМАТИЧЕСКИЙ СПАВН БОССОВ
auto_spawn:
  enabled: true                # Включить автоспавн по календарю
  spawn_radius: 10             # Радиус спавна босса вокруг точки
  announce_before_spawn: true  # Оповещать игроков заранее
  announce_time: 30            # За сколько секунд до спавна оповещать

# 2. КАЛЕНДАРЬ СОБЫТИЙ
calendar:
  enabled: true                              # Включить календарь
  command: "/calendar"                       # Команда открытия
  title: "&6&l📅 Календарь событий"          # Заголовок GUI
  size: 54                                   # Размер инвентаря (кратно 9)
  timezone: "Europe/Moscow"                  # Часовой пояс
  schedule:                                  # Расписание по дням
    monday:
      - time: "12:00"
        boss: "zombie_boss"
        message: "&a&lСегодня в 12:00 появится Главный Зомби!"
      - time: "18:00"
        boss: "skeleton_boss"
        message: "&a&lСегодня в 18:00 появится Скелет-Воин!"
    tuesday:
      - time: "15:00"
        boss: "spider_boss"
        message: "&a&lСегодня в 15:00 появится Паук-Король!"
    wednesday:
      - time: "14:00"
        boss: "zombie_boss"
        message: "&a&lСегодня в 14:00 появится Главный Зомби!"
      - time: "19:00"
        boss: "dragon_boss"
        message: "&a&lСегодня в 19:00 появится ★ Дракон Края ★!"
    thursday:
      - time: "16:00"
        boss: "skeleton_boss"
        message: "&a&lСегодня в 16:00 появится Скелет-Воин!"
    friday:
      - time: "17:00"
        boss: "piglin_boss"
        message: "&a&lСегодня в 17:00 появится Повелитель Незера!"
      - time: "22:00"
        boss: "dragon_boss"
        message: "&a&lСегодня в 22:00 появится ★ Дракон Края ★!"
    saturday:
      - time: "10:00"
        boss: "zombie_boss"
        message: "&a&lСегодня в 10:00 появится Главный Зомби!"
      - time: "22:00"
        boss: "dragon_boss"
        message: "&a&lСегодня в 22:00 появится ★ Дракон Края ★!"
    sunday: []

